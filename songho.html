<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Songho Game</title>
    <link rel="stylesheet" href="./songho.css">
</head>
<body>
  <!-- ============================================================
                                ACCUEIL
       ============================================================ -->
    <section id="accueil">
        <div class="header">
            <img src="./Images/Logo2.png" alt="Logo"class="home-logo">
            <h1 class="game-name">SONGHO</h1>
            <p class="subtitle">Jeu traditionnel africain de graines à deux joueurs.</p>

        </div>
        <div class="main">
            <div id="zone-section">
                <p>North</p>
                <p>South</p>
            </div>
            <form action="" method="">
                <label for="name"></label>
                <input type="text" id="name" placeholder="Enter your name">
                <label for="zone"></label>
                <input type="text" id="zone" placeholder="Enter your choosen zone">
            </form>
            <button class="btn-play">Start Game</button>
        </div>
    </section>

</body>
</html>
