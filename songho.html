<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Songho Game</title>
    <link rel="stylesheet" href="./songho.css">
</head>
<body>
  <!-- ============================================================
                                ACCUEIL
       ============================================================ -->
    <section id="accueil">
        <div class="header">
            <img src="./Images/Logo2.png" alt="Logo"class="home-logo">
            <h1 class="game-name">SONGHO</h1>
            <p class="subtitle">Jeu traditionnel africain de graines à deux joueurs.</p>

        </div>
        <div class="main">
            <div id="zone-section">
                <p>North</p>
                <p>South</p>
            </div>
            <div class="input_zone">
            <input type="text" id="name" placeholder="Enter your name">
            <input type="text" id="zone" placeholder="Enter your choosen zone">
            <button class="btn-play" onclick="startGame()">Start Game</button>
            </div>
        </div>
    </section>

<script>
    function startGame() { // fonction pour recuperer les valeurs entree
    const name = document.getElementById('name').value;
    const zone = document.getElementById('zone').value;

    if (name === "" || zone === "") {
        alert("Enter all the information !");
        return; // bloque la redirection
    }

    window.location.href = `game_page.html?name=${name}&zone=${zone}`; //recupere les valeurs entree pour les passer dans l'autre page 
}
</script>
</body>
</html>
